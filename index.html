<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vanta-c</title>
  <style>
    /* ── Reset & base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    /* ── Full-page background ─────────────────────────────────── */
    body {
      /*
       * PLACEHOLDER BACKGROUND
       * Replace this gradient with a real image, e.g.:
       *   background-image: url('assets/bg.jpg');
       */
      background-image:
        linear-gradient(135deg, #0d0d2b 0%, #1a1a4e 30%, #0a2a4a 60%, #0d1b2a 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
      color: #fff;
    }

    /* ── Page layout ──────────────────────────────────────────── */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: clamp(1.5rem, 5vw, 4rem);
      text-align: center;
    }

    /* ── Hero title ───────────────────────────────────────────── */
    .hero-title {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      text-transform: lowercase;
      background: linear-gradient(135deg, #fff 30%, #a8d8ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      margin-bottom: 0.5rem;
    }

    .hero-subtitle {
      font-size: clamp(0.9rem, 2.5vw, 1.25rem);
      font-weight: 400;
      color: rgba(255,255,255,0.75);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: clamp(2rem, 6vw, 4rem);
    }

    /* ── Nav links ────────────────────────────────────────────── */
    .nav-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.75rem 1.25rem;
      margin-bottom: clamp(2.5rem, 6vw, 4.5rem);
      list-style: none;
    }

    .nav-links a {
      display: inline-block;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      font-size: clamp(0.85rem, 2vw, 1rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0.4rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.35);
      transition: color 0.2s, border-color 0.2s;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: #fff;
      border-color: #fff;
      outline: none;
    }

    /* ── Widget grid ──────────────────────────────────────────── */
    .widgets {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
      width: 100%;
      max-width: 960px;
      margin-bottom: clamp(2rem, 5vw, 4rem);
    }

    .widget {
      background: rgba(255,255,255,0.10);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 0.9rem;
      padding: 0;
      overflow: hidden;
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.25s, transform 0.25s;
    }

    .widget:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-3px);
    }

    .widget-icon {
      font-size: 2rem;
      margin-bottom: 0.6rem;
    }

    .widget-title {
      font-size: clamp(0.95rem, 2.2vw, 1.1rem);
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .widget-desc {
      font-size: clamp(0.8rem, 1.8vw, 0.9rem);
      color: rgba(255,255,255,0.7);
      line-height: 1.5;
    }

    .widget-inner {
      padding: clamp(1.25rem, 3vw, 2rem);
      width: 100%;
      text-align: center;
    }

    /* Small contact widget (replaces CTA) */
    .widget.small-widget {
      min-height: auto;
      max-width: 320px;
      width: auto;
      border-radius: 0.9rem;
    }
    .widget.small-widget .widget-inner {
      padding: 0.6rem 1rem;
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
    }
    .widget.small-widget .widget-icon { font-size: 1.25rem; margin-bottom: 0; }
    .widget.small-widget .widget-title { font-size: 0.95rem; margin: 0; }
    .widget.small-widget .widget-desc { font-size: 0.85rem; color: rgba(255,255,255,0.85); margin: 0; }

    /* Full-iframe widget */
    .widget.full-iframe {
      /* uses the shared .widget sizing */
    }
    .widget.full-iframe iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      border-radius: 0.9rem;
      vertical-align: top;
    }

    /* ── CTA button ───────────────────────────────────────────── */
    .cta {
      display: inline-block;
      padding: 0.85em 2.2em;
      background: #fff;
      color: #111;
      font-size: clamp(0.875rem, 2vw, 1rem);
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 9999px;
      transition: background 0.2s, color 0.2s, transform 0.2s;
    }

    .cta:hover,
    .cta:focus-visible {
      background: rgba(255,255,255,0.85);
      transform: scale(1.04);
      outline: none;
    }

    /* ── Footer ───────────────────────────────────────────────── */
    .footer {
      position: fixed;
      bottom: 1.25rem;
      width: 100%;
      text-align: center;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.45);
      letter-spacing: 0.05em;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <main class="page">
    <!-- Title -->
    <h1 class="hero-title">Vanta-c</h1>
    <p class="hero-subtitle">DJ - London, UK</p>

    <!-- Widgets -->
    <div class="widgets" role="list">
      <div class="widget" role="listitem">
        <div class="widget-inner">
          <div class="widget-desc">Hailing from London, UK, Vantac thrives to create an atmosphere for getting lost in the music, typically using deep, dark and driving techno based sound to keep people moving.</div>
        </div>
      </div>
      <div class="widget full-iframe" role="listitem">
        <iframe src="https://player-widget.mixcloud.com/widget/iframe/?hide_cover=1&feed=%2FVantac%2Ftechnohardgroove-for-dungeon-activities%2F" frameborder="0" allow="encrypted-media; fullscreen; autoplay; idle-detection; speaker-selection; web-share;"></iframe>
      </div>
    </div>

    <!-- Small contact widget (replaces CTA) -->
    <div class="widget small-widget" role="note">
      <div class="widget-inner">
        <div class="widget-icon">✉️</div>
        <div>
          <div class="widget-title">Contact</div>
          <div class="widget-desc">joey@vant.ac</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">© 2026 vanta-c</footer>

</body>
</html>
